services:
  postgres:
    env_file: !reset []
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration-only
      POSTGRES_DB: bills_integration
    ports: !reset []

  elasticsearch:
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: !reset []

  embedding-stub:
    build: .
    command: python tests/integration/embedding_stub.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/v1/models')"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    env_file: !reset []
    environment: &integration-env
      DATABASE_URL: postgresql://integration:integration-only@postgres:5432/bills_integration
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: bills-phase0c
      EMBEDDING_BASE_URL: http://embedding-stub:8081/v1
      EMBEDDING_MODEL: deterministic-test-model
      EMBEDDING_DIMENSIONS: "16"
      EMBEDDING_PROVIDER: openai-compatible
      EMBEDDING_DOCUMENT_MODE: text
      EMBEDDING_API_KEY: ""
      ELASTICSEARCH_API_KEY: ""
      ELASTICSEARCH_USERNAME: ""
      ELASTICSEARCH_PASSWORD: ""
      EMBEDDING_TIMEOUT_SECONDS: "10"
      API_TOKEN: integration-only-token
      DATA_DIR: /data
      JOB_LEASE_SECONDS: "30"
      JOB_HEARTBEAT_SECONDS: "2"
      GENERATION_RETENTION_SECONDS: "86400"
      PHASE0C_INTEGRATION: "1"
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      AZURE_STORAGE_CONTAINER: bills-integration
    ports: !reset []
    volumes: !override
      - integration-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 60
    depends_on:
      embedding-stub:
        condition: service_healthy

  worker:
    env_file: !reset []
    command: python tests/integration/worker_service.py
    environment:
      <<: *integration-env
      PHASE0C_HOOK_DIR: /integration-hooks
    volumes: !override
      - integration-data:/data
      - integration-hooks:/integration-hooks

  integration-tests:
    build: .
    command: sh -c 'touch /integration-hooks/pause-claiming && touch /integration-hooks/workers-start && python -m unittest discover -s tests -p test_phase0c_integration.py -v'
    environment:
      <<: *integration-env
      APP_URL: http://app:8000
      PHASE0C_HOOK_DIR: /integration-hooks
    env_file: !reset []
    volumes: !override
      - integration-hooks:/integration-hooks
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  integration-data:
  integration-hooks:
