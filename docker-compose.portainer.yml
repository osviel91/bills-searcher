services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the Stack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Stack}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the Stack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  schema-migrate:
    build: .
    command: python migrate_schema.py
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?Set DATABASE_MIGRATION_URL in the Stack}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in the Stack}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in the Stack}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    environment: &application-environment
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the Stack}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in the Stack}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:?Set Azure Blob connection string in the Stack}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-invoice-pdfs}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:?Set external Elasticsearch URL in the Stack}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-invoices-poc-v1}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?Set embedding service URL in the Stack}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai-compatible}
      EMBEDDING_DOCUMENT_MODE: ${EMBEDDING_DOCUMENT_MODE:-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-300}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_BATCH_FILES: ${MAX_BATCH_FILES:-100}
      SEARCH_TOP_K: ${SEARCH_TOP_K:-10}
      DATA_DIR: /data
      AS400_SHADOW_ENABLED: ${AS400_SHADOW_ENABLED:-false}
      AS400_SHADOW_PERSISTENCE_ENABLED: ${AS400_SHADOW_PERSISTENCE_ENABLED:-false}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8080:8000"
    volumes:
      - embedding-settings-data:/data
    depends_on:
      schema-migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: python worker.py
    environment: *application-environment
    volumes:
      - embedding-settings-data:/data
    depends_on:
      schema-migrate:
        condition: service_completed_successfully

volumes:
  embedding-settings-data:
  postgres-data:
